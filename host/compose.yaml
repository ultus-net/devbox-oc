# /srv/devbox/compose.yaml
#
# The host runs this file. Terraform owns Azure resources and stops there, so
# the container is declared in exactly one place.
#
# Binding: the server listens on 0.0.0.0 *inside* the container network
# namespace and is published to loopback only. Nothing is reachable from the
# VNet or the internet. tailscaled terminates TLS and proxies to 127.0.0.1.

name: devbox

services:
  opencode:
    image: ${OC_IMAGE:?set OC_IMAGE to an immutable registry reference}
    restart: unless-stopped
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    ports:
      - "127.0.0.1:4096:4096"
    env_file:
      - /etc/opencode/env
    environment:
      HOME: /home/dev
      TZ: ${TZ:-Europe/London}
    volumes:
      - oc-data:/home/dev/.local/share/opencode
      - oc-config:/home/dev/.config/opencode
      - oc-state:/home/dev/.local/state/opencode
      - oc-cache:/home/dev/.cache
      - /srv/repos:/home/dev/repos
    healthcheck:
      test: ["CMD", "opencode", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  oc-data:
  oc-config:
  oc-state:
  oc-cache:
