[Socket]
# Fedora Server ships cockpit-ws and enables cockpit.socket, which listens on
# 9090 on every interface. Decision 9 keeps this host to one door, the tailnet,
# so the socket is rebound to loopback. An empty ListenStream= drops the
# inherited list before the loopback entry is added.
ListenStream=
ListenStream=127.0.0.1:9090
