name: image

# Build the container image, push an attested sha- digest, smoke-test that
# digest, then promote :prod to it. The gate runs after the immutable sha- push
# and before any :prod move, so a broken image can exist in the registry under
# sha- only and never answers on the prod tag.
#
# The workflow cannot push to protected main. After promoting :prod it compares
# the pushed digest with image/prod-digest.txt and, when the record is stale,
# pushes a chore/prod-digest branch, prints its compare URL and fails the run so
# the drift is never silent. The token cannot open the PR, so an operator reads
# the one-line diff and opens it.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # A push that only rewrites the record must not build: the rebuild stamps a
    # new digest and re-stales the record it just fixed. Path filters are not
    # evaluated for tag pushes, so a release tag still builds.
    paths:
      - image/**
      - .github/workflows/image.yml
      - '!image/prod-digest.txt'
  pull_request:
    paths:
      - image/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devbox

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag

      # The version comes from the Dockerfile, so the gate compares the built
      # binary with the pin instead of accepting any semver. An empty value must
      # fail here, not turn the pin off.
      - name: Resolve the smoke pin
        id: pin
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^ARG OC_VERSION=//p' image/Dockerfile)"
          [ -n "$pin" ] || { echo "no OC_VERSION in image/Dockerfile" >&2; exit 1; }
          echo "SMOKE_OC_VERSION=$pin" >> "$GITHUB_ENV"

      - name: Build and push the attested digest
        id: build
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # The docker exporter used by load drops attestations silently, so this
      # step does not claim them. This path also keeps a PR build local: it
      # never logs in and never pushes.
      - name: Build for the local smoke test
        id: build-local
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: image
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Pull and smoke-test the published digest
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          ENGINE: docker
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          ./image/smoke.sh "$IMAGE_REF"

      - name: Smoke-test the local build
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        env:
          ENGINE: docker
        run: |
          set -euo pipefail
          IMAGE_REF="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -1)"
          ./image/smoke.sh "$IMAGE_REF"

      # The promoted tag must follow the digest the gate just tested. imagetools
      # copies the source index, so the attestation child travels with it; the
      # check fails the run if it does not.
      - name: Promote prod to the tested digest
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE_NAME}:prod" "${IMAGE_NAME}@${DIGEST}"
          # jq ships on the GitHub-hosted runner, so this adds no install step.
          # Parse the index and read the child annotations, so a moved field or a
          # comment cannot satisfy the check.
          docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMAGE_NAME}:prod" \
            | jq -e '[.manifests[].annotations["vnd.docker.reference.type"]]
                     | any(. == "attestation-manifest")' >/dev/null \
            || { echo "promoted ${IMAGE_NAME}:prod carries no attestation manifest" >&2; exit 1; }
          {
            echo "Promoted ${IMAGE_NAME}:prod to ${DIGEST}"
            echo "The attested digest is the sha- tag; image/prod-digest.txt records the rollback point."
          } >> "$GITHUB_STEP_SUMMARY"

  record-digest:
    # A separate job, because GitHub has no step-level permissions: this is the
    # only place that holds a write token, and it never runs PR-controlled code.
    # The build job above executes image/smoke.sh from the checked-out ref.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Record the digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Promoted ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          ./image/promote-digest.sh "$DIGEST"
