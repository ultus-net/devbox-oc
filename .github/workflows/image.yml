name: image

# Build the container image, smoke-gate it, then push it to GHCR. The smoke test
# runs before any push, so a broken image never reaches the registry.
#
# The workflow cannot push to protected main. After promoting :prod it compares
# the pushed digest with image/prod-digest.txt, opens a chore/prod-digest branch
# when the record is stale, and fails the run so the drift is never silent. A
# workflow token does not trigger workflows, so that PR arrives without CI.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - image/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devbox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=prod,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      # load: true keeps the image local so the smoke test runs before a push.
      # Attestations are not set here on purpose: the docker exporter used by
      # load does not carry them, so claiming provenance here would be false.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: image
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        env:
          ENGINE: docker
        run: |
          set -euo pipefail
          # The version comes from the Dockerfile, so the gate compares the built
          # binary with the pin instead of accepting any semver. An empty value
          # must fail here, not turn the pin off.
          SMOKE_OC_VERSION="$(sed -n 's/^ARG OC_VERSION=//p' image/Dockerfile)"
          [ -n "$SMOKE_OC_VERSION" ] || { echo "no OC_VERSION in image/Dockerfile" >&2; exit 1; }
          export SMOKE_OC_VERSION
          ./image/smoke.sh "$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -1)"

      - name: Push
        # A manual run on a feature branch builds and smoke-tests but never
        # publishes, so an unreviewed commit cannot land in the registry.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: docker image push --all-tags "${IMAGE_NAME}"

      - name: Record the digest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:prod")"
          # The file wants the bare digest; the RepoDigest form is repo@sha256:...
          digest="${repo_digest##*@}"
          echo "Promoted ${digest}" >> "$GITHUB_STEP_SUMMARY"
          if ./image/check-prod-digest.sh "$digest"; then
            exit 0
          fi
          # The record is stale. Repair it on a branch, open a PR, then fail this
          # run: if the PR cannot be opened, the red run is the only signal.
          ./image/write-prod-digest.sh "$digest"
          branch="chore/prod-digest-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add image/prod-digest.txt
          git commit -m "chore: record the promoted prod digest"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: record the promoted prod digest" \
            --body "The main build promoted ${digest} while image/prod-digest.txt was stale. This PR updates the rollback record. The build run that opened it failed on purpose, and a workflow token does not run CI, so check it before merging."
          exit 1
