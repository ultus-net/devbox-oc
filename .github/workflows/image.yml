name: image

# Build the container image, smoke-gate it, then push it to GHCR. The smoke test
# runs before any push, so a broken image never reaches the registry.
#
# The workflow cannot update image/prod-digest.txt: main is protected and a
# workflow token must not push to it. It prints the digest in the job summary
# instead, and the promotion PR records it in that file.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - image/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devbox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=prod,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      # load: true keeps the image local so the smoke test runs before a push.
      # provenance and sbom ride in the manifest, so a pulled image can be traced
      # to its build.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: image
          load: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        env:
          ENGINE: docker
        run: |
          set -euo pipefail
          # The version comes from the Dockerfile, so the gate compares the built
          # binary with the pin instead of accepting any semver.
          SMOKE_OC_VERSION="$(sed -n 's/^ARG OC_VERSION=//p' image/Dockerfile)"
          export SMOKE_OC_VERSION
          ./image/smoke.sh "$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -1)"

      - name: Push
        # A manual run on a feature branch builds and smoke-tests but never
        # publishes, so an unreviewed commit cannot land in the registry.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: docker image push --all-tags "${IMAGE_NAME}"

      - name: Record the digest
        if: github.ref == 'refs/heads/main'
        run: |
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:prod")"
          echo "Promoted ${digest}" >> "$GITHUB_STEP_SUMMARY"
