name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check pyyaml

      # Pinned by version and sha256, like Butane. An apt shellcheck moves with
      # the runner image, so CI can fail a head the local gate passed.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl -fsSL -o /tmp/shellcheck.tar.gz "$url"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.gz" | sha256sum -c -
          tar -xzf /tmp/shellcheck.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          # The gate compares this binary with the pin, so prove the right one
          # resolved on PATH rather than an apt copy earlier in the search order.
          [ "$(shellcheck --version | awk '/^version:/ {print $2}')" = "${SHELLCHECK_VERSION#v}" ]

      # Pinned by version and sha256. The artifact reproducibility check reads
      # BUTANE, and without it that check silently skips.
      - name: Install Butane
        env:
          BUTANE_VERSION: v0.29.0
          BUTANE_SHA256: 53a20d820fbaa7fda4f1afd1814974badc8e448db4c151d3f1ba005dc29bc4c9
        run: |
          set -euo pipefail
          url="https://github.com/coreos/butane/releases/download/${BUTANE_VERSION}/butane-x86_64-unknown-linux-gnu"
          curl -fsSL -o /tmp/butane "$url"
          echo "${BUTANE_SHA256}  /tmp/butane" | sha256sum -c -
          sudo install -m 0755 /tmp/butane /usr/local/bin/butane
          butane --version

      - name: Verify
        env:
          BUTANE: /usr/local/bin/butane
          # The integrity suite downloads the pinned npm artifact. A download
          # failure is a real failure here, not a skip.
          ALLOW_INTEGRITY_SKIP: "0"
        run: ./tests/verify.sh
