# pipelines/devbox-os.yml
trigger: none
pr: none
schedules:
  - cron: "0 4 * * 1"
    displayName: weekly OS image refresh
    branches: { include: [main] }
    always: true

jobs:
  - job: publish
    pool: { vmImage: ubuntu-latest }
    # build-os-image.sh requires RG and STORAGE_ACCOUNT, so the job supplies them.
    variables:
      resourceGroup: rg-devbox-oc
      storageAccount: stdevboxocimages
      location: westeurope
    steps:
      # Install real podman. A symlink from docker would accept `--version` and then
      # fail on the flags image-builder needs: docker rejects `--security-opt
      # label=type:...` (SELinux) and has no `/var/lib/containers/storage`.
      # The version is printed so the agent records what actually ran.
      - script: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman
          podman --version
          podman info --format '{{.Host.Security.SELinuxEnabled}}' || true
        displayName: install podman for image-builder
      - task: AzureCLI@2
        displayName: build the ucore vhd and publish a managed image
        inputs:
          azureSubscription: devbox-image
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            export RG="$(resourceGroup)"
            export STORAGE_ACCOUNT="$(storageAccount)"
            export LOCATION="$(location)"
            ./os/build-os-image.sh | tee image-id.txt
      - script: |
          echo "Apply this as os_image_id:"; tail -1 image-id.txt
        displayName: print the image id for Terraform
