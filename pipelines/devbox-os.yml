# pipelines/devbox-os.yml
trigger: none
pr: none
schedules:
  - cron: "0 4 * * 1"
    displayName: weekly OS image refresh
    branches: { include: [main] }
    always: true

jobs:
  - job: publish
    pool: { vmImage: ubuntu-latest }
    # build-os-image.sh defaults to the same values. The pipeline states them so
    # the target is visible in the run rather than inherited from an agent.
    variables:
      resourceGroup: rg-csh-dev
      location: newzealandnorth
      # This runner is Ubuntu, and image-builder ships for Fedora only, so the
      # script runs the pinned builder container instead of a host binary. The
      # digest pin matters here for the same reason the OS pin does: a moving tag
      # would change how the image is produced without changing this file.
      imageBuilderContainer: ghcr.io/osbuild/image-builder-cli@sha256:c4755dacf071c36aaea98bd3fbd1833ba1bb7b0f9b363fbbc9720063404a423c
    steps:
      # The script pulls the OS container with podman, and the builder container
      # reads it from that same storage, so podman must be present and be the one
      # the builder shares. Ubuntu runners ship docker, not podman.
      - script: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman --version
        displayName: install podman for container storage
      - task: AzureCLI@2
        displayName: publish managed image
        inputs:
          azureSubscription: devbox-image
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            export RG="$(resourceGroup)"
            export LOCATION="$(location)"
            export IMAGE_BUILDER_CONTAINER="$(imageBuilderContainer)"
            # The builder needs root to mount disks, so the script runs under sudo.
            # sudo resets the environment, and AzureCLI@2 keeps its token in
            # AZURE_CONFIG_DIR, so that variable has to cross the boundary too:
            # without it az runs as root against /root/.azure and reports no login.
            # HOME comes along for the same reason, because the CLI falls back to
            # $HOME/.azure when AZURE_CONFIG_DIR is unset.
            sudo --preserve-env=RG,LOCATION,IMAGE_BUILDER_CONTAINER,AZURE_CONFIG_DIR,HOME \
              env PATH="$PATH" \
              ./os/build-os-image.sh | tee image-id.txt
      - task: AzureCLI@2
        displayName: verify the published image is Gen2
        inputs:
          azureSubscription: devbox-image
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            id="$(tail -1 image-id.txt)"
            case "$id" in
              /subscriptions/*/providers/Microsoft.Compute/images/*) ;;
              *) echo "not an image id: $id" >&2; exit 1 ;;
            esac
            generation="$(az image show --ids "$id" --query hyperVGeneration -o tsv)"
            [ "$generation" = "V2" ] \
              || { echo "image generation is $generation, expected V2" >&2; exit 1; }
            echo "published $id (hyperVGeneration $generation)"
      - script: |
          echo "Record this as the OS image id:"; tail -1 image-id.txt
        displayName: print the image id for the deployment
