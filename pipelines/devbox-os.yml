# pipelines/devbox-os.yml
trigger: none
pr: none
schedules:
  - cron: "0 4 * * 1"
    displayName: weekly OS image refresh
    branches: { include: [main] }
    always: true

jobs:
  - job: publish
    pool: { vmImage: ubuntu-latest }
    # build-os-image.sh requires RG and STORAGE_ACCOUNT, so the job supplies them.
    variables:
      resourceGroup: rg-devbox-oc
      storageAccount: stdevboxocimages
      location: westeurope
    steps:
      # get.coreos-installer.dev does not resolve (verified: NXDOMAIN), so the
      # upstream container is the source. Pinned per the no-latest constraint.
      #
      # Extract into a directory that persists across steps and advertise it with
      # the Azure Pipelines logging command, not $GITHUB_PATH, which does not exist
      # here. build-os-image.sh runs in a later step and needs the binary on PATH.
      - script: |
          set -euo pipefail
          bindir="$(Pipeline.Workspace)/bin"
          mkdir -p "$bindir"
          docker run --rm --entrypoint cat \
            quay.io/coreos/coreos-installer:v0.27.0 /usr/bin/coreos-installer \
            > "$bindir/coreos-installer"
          chmod +x "$bindir/coreos-installer"
          echo "##vso[task.prependpath]$bindir"
          "$bindir/coreos-installer" --version
        displayName: install coreos-installer from the pinned upstream image
      - task: AzureCLI@2
        displayName: publish managed image
        inputs:
          azureSubscription: devbox-image
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            export RG="$(resourceGroup)"
            export STORAGE_ACCOUNT="$(storageAccount)"
            export LOCATION="$(location)"
            ./os/build-os-image.sh | tee image-id.txt
      - script: |
          echo "Apply this as os_image_id:"; tail -1 image-id.txt
        displayName: print the image id for Terraform
