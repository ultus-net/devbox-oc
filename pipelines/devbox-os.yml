# pipelines/devbox-os.yml
trigger: none
pr: none
schedules:
  - cron: "0 4 * * 1"
    displayName: weekly OS image refresh
    branches: { include: [main] }
    always: true

jobs:
  - job: publish
    pool: { vmImage: ubuntu-latest }
    # build-os-image.sh requires RG and STORAGE_ACCOUNT, so the job supplies them.
    variables:
      resourceGroup: rg-devbox-oc
      storageAccount: stdevboxocimages
      location: westeurope
    steps:
      # image-builder drives a container engine and needs it privileged. The agent
      # ships docker, so expose it under the name the script and image-builder
      # expect rather than installing a second engine alongside it.
      - script: |
          set -euo pipefail
          sudo ln -sf "$(command -v docker)" /usr/local/bin/podman
          podman --version
        displayName: expose a podman-compatible engine for image-builder
      - task: AzureCLI@2
        displayName: build the ucore vhd and publish a managed image
        inputs:
          azureSubscription: devbox-image
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            export RG="$(resourceGroup)"
            export STORAGE_ACCOUNT="$(storageAccount)"
            export LOCATION="$(location)"
            ./os/build-os-image.sh | tee image-id.txt
      - script: |
          echo "Apply this as os_image_id:"; tail -1 image-id.txt
        displayName: print the image id for Terraform
